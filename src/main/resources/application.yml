spring:
  datasource:
    url: jdbc:h2:mem:accounts;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
  h2:
    console.enabled: true
logging:
  pattern:
    console: =%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] %msg%n
management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info